# Catppuccin Frappé — tmux statusline + theme
# Palette: base #303446  mantle #292c3c  surface0 #414559
#          text #c6d0f5  subtext0 #a5adce  overlay0 #737994
#          blue #8caaee  mauve #ca9ee6  green #a6d189  red #e78284  yellow #e5c890  teal #81c8be
# Separators (need a Nerd Font):      

# Core styles
set -g mode-style "fg=#303446,bg=#8caaee"
set -g message-style "fg=#c6d0f5,bg=#414559"
set -g message-command-style "fg=#c6d0f5,bg=#414559"

# Pane borders
set -g pane-border-style "fg=#414559"
set -g pane-active-border-style "fg=#8caaee"

# Status bar
set -g status "on"
set -g status-interval 1
set -g status-justify "left"
set -g status-style "fg=#a5adce,bg=#303446"
set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

# Panes and clock
set -g display-panes-active-colour "#8caaee"
set -g display-panes-colour "#e78284"
setw -g clock-mode-colour "#81c8be"

# Left/right sections
set -g status-right "#[fg=#ca9ee6,bg=#303446]#[fg=#303446,bg=#ca9ee6,bold] #S "
set -g status-left ""

# Windows
setw -g window-status-activity-style "underscore,fg=#e5c890,bg=#303446"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#737994,bg=#303446"
setw -g window-status-format '#[fg=#303446,bg=#303446]#[default] #I  #W #[fg=#303446,bg=#303446,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#303446,bg=#414559]#[fg=#c6d0f5,bg=#414559,bold] #I #[fg=#414559,bg=#8caaee]#[fg=#303446,bg=#8caaee] #W #[fg=#8caaee,bg=#303446,nobold]'
